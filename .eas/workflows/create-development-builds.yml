name: Mobile Development Build

on:
  push:
    branches:
      - dev

jobs:
  build:
    type: build
    params:
      platform: android
      profile: development

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Development App
        run: eas build --platform android --profile development --non-interactive
        echo:"Development Build successfully created"